name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit, integration, authorization
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: answer_everything_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/answer_everything_test
      DATABASE_APP_URL: postgres://ae_app:ae_app_dev_password@localhost:5432/answer_everything_test
      DATABASE_IDENTITY_URL: postgres://ae_identity:ae_identity_dev_password@localhost:5432/answer_everything_test
      AE_DB_APP_PASSWORD: ae_app_dev_password
      AE_DB_IDENTITY_PASSWORD: ae_identity_dev_password
      AE_SESSION_SECRET: ci-session-secret-ci-session-secret-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:authorization
      - run: pnpm --filter @ae/api build && pnpm --filter @ae/worker build
      - run: pnpm --filter @ae/web build

  images:
    name: Build container images
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/answer-everything-${{ matrix.app }}:dev
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.DEV_API_PUBLIC_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Promotion to UAT and PROD is a manual, reviewed step: the same images are
  # re-tagged and `terraform apply` runs in the environment's folder with the
  # environment's protected secrets. See docs/DEPLOYMENT.md.
